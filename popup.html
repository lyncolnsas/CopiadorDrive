<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiador & Catalogador de Drive</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-card">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="Logo" class="brand-icon">
        <div class="brand-text">
          <h1>Copiador & Catalogador</h1>
          <span class="brand-tag">v1.1.0</span>
        </div>
      </div>
      <div id="auth-status-badge" class="badge badge-offline" title="Status da Conexão">
        <span class="badge-dot"></span>
        <span id="auth-badge-text">Desconectado</span>
      </div>
    </header>

    <!-- Auth View (1-Click Google Sign In) -->
    <section id="auth-section" class="view-section">
      <div class="auth-box">
        <div class="auth-illustration">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4C9.11 4 6.6 5.64 5.35 8.04C2.34 8.36 0 10.91 0 14C0 17.31 2.69 20 6 20H19C21.76 20 24 17.76 24 15C24 12.36 21.95 10.22 19.35 10.04ZM19 18H6C3.79 18 2 16.21 2 14C2 11.95 3.53 10.24 5.56 10.03L6.63 9.92L7.13 8.97C8.08 7.14 9.94 6 12 6C14.62 6 16.88 7.86 17.39 10.43L17.69 11.93L19.22 12.04C20.78 12.14 22 13.45 22 15C22 16.65 20.65 18 19 18ZM8 13H10.55V16H13.45V13H16L12 9L8 13Z" fill="#1a73e8"/>
          </svg>
        </div>
        <h2>Conecte seu Google Drive</h2>
        <p>Faça login em 1 clique para clonar pastas ou gerar catálogos interativos diretamente na sua conta.</p>
        <button id="login-btn" class="btn btn-primary btn-google">
          <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Conectar com Google
        </button>
      </div>
    </section>

    <!-- Main View -->
    <section id="app-section" class="view-section hidden">
      
      <!-- Dual Mode Selector Bar -->
      <div class="mode-tabs">
        <button id="tab-mode-copy" class="mode-tab-btn active">
          <span>🚀 Clonar no Drive</span>
        </button>
        <button id="tab-mode-catalog" class="mode-tab-btn">
          <span>📄 Gerar Catálogo</span>
        </button>
      </div>

      <!-- Common Folder Input -->
      <div class="input-group">
        <label for="folder-input" class="input-label">
          <span id="input-label-text">Link ou ID da Pasta do Drive:</span>
          <span id="detected-count" class="counter-badge">0 detectado(s)</span>
        </label>
        <textarea 
          id="folder-input" 
          rows="2" 
          placeholder="Cole o link ou ID da pasta do Google Drive...&#10;https://drive.google.com/drive/folders/..."
          spellcheck="false"
        ></textarea>
      </div>

      <!-- ================= MODE 1: COPY VIEW ================= -->
      <div id="copy-view-panel">
        <!-- Advanced Options Toggle -->
        <details class="advanced-details">
          <summary>Opções de Cópia</summary>
          <div class="options-content">
            <label class="checkbox-label">
              <input type="checkbox" id="force-fresh">
              <span>Forçar Novo Mapeamento (Ignorar Cache)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="clear-copy-only">
              <span>Limpar Memória de Cópia</span>
            </label>
          </div>
        </details>

        <!-- Action Buttons -->
        <div class="actions-wrapper">
          <button id="start-btn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            Iniciar Cópia
          </button>
          <button id="cancel-btn" class="btn btn-danger hidden">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h12v12H6z"/>
            </svg>
            Cancelar
          </button>
        </div>

        <!-- Progress Card -->
        <div id="progress-container" class="progress-card hidden">
          <div class="progress-header">
            <div class="spinner-small" id="progress-spinner"></div>
            <span id="status-text" class="status-msg">Iniciando...</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
          </div>
          <div class="progress-meta">
            <span id="progress-details">0 itens</span>
            <span id="progress-eta"></span>
          </div>
        </div>
      </div>

      <!-- ================= MODE 2: CATALOG VIEW ================= -->
      <div id="catalog-view-panel" class="hidden">
        <div class="input-group" style="margin-top: 4px;">
          <label for="catalog-title-input" class="input-label">
            <span>Título Personalizado (Opcional):</span>
          </label>
          <input 
            type="text" 
            id="catalog-title-input" 
            class="text-input" 
            placeholder="Ex: Treinamento Completo de Vendas"
          >
        </div>

        <!-- Action Buttons for Catalog -->
        <div class="actions-wrapper">
          <button id="start-catalog-btn" class="btn btn-accent">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            Gerar Catálogo HTML
          </button>
        </div>

        <!-- Catalog Status Card -->
        <div id="catalog-progress-container" class="progress-card hidden">
          <div class="progress-header">
            <div class="spinner-small" id="catalog-spinner"></div>
            <span id="catalog-status-text" class="status-msg">Mapeando pasta...</span>
          </div>
          <div class="catalog-result-actions hidden" id="catalog-ready-actions">
            <button id="preview-catalog-btn" class="btn btn-success">
              👁️ Abrir Catálogo
            </button>
            <button id="download-catalog-btn" class="btn btn-primary">
              💾 Baixar HTML
            </button>
          </div>
        </div>
      </div>

      <!-- Shared Dashboard Link Button -->
      <div style="margin-top: 10px;">
        <button id="open-tab-btn" class="btn btn-secondary" title="Abrir painel detalhado com árvore visual e catálogos">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
          Painel de Controle Completo
        </button>
      </div>

      <!-- Footer Bar -->
      <footer class="app-footer">
        <button id="logout-btn" class="btn-text">Desconectar Conta</button>
      </footer>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
